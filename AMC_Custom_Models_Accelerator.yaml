        Statement:
          - Action:
              - cloudwatch:PutMetricData
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Effect: Allow
            Resource: "*"
        Version: "2012-10-17"
      PolicyName: ACMCloudWatchAccessRoleDefaultPolicyF179A896
      Roles:
        - Ref: ACMCloudWatchAccessRole4111A26A
    Metadata:
      aws:cdk:path: mmmtesting/ACMCloudWatchAccessRole/DefaultPolicy/Resource
  LambdaExecutionRoleD5C26073:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
        Version: "2012-10-17"
      Description: Role for ACM Lambda functions
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Application
          Value: ACM-Custom-Models
        - Key: Component
          Value: ML-Pipeline
    Metadata:
      aws:cdk:path: mmmtesting/LambdaExecutionRole/Resource
  LambdaExecutionRoleDefaultPolicy6D69732F:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
            Effect: Allow
            Resource:
              - Fn::GetAtt:
                  - ACMAlgorithmConfigsTable54D3AB22
                  - Arn
              - Fn::GetAtt:
                  - PipelineExecutionsTable2DEF886F
                  - Arn
          - Action: secretsmanager:GetSecretValue
            Effect: Allow
            Resource:
              Ref: AmazonAdsApiSecrets3DCB4A44
          - Action:
              - sagemaker:CreateTrainingJob
              - sagemaker:DescribeTrainingJob
              - sagemaker:CreateTransformJob
              - sagemaker:DescribeTransformJob
            Effect: Allow
            Resource:
              Fn::Sub: arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:*
          - Action:
              - s3:PutObject
              - s3:ListBucket
            Effect: Allow
            Resource:
              - Fn::GetAtt:
                  - ACMDataBucket10FB3863
                  - Arn
              - Fn::Join:
                  - ""
                  - - Fn::GetAtt:
                        - ACMDataBucket10FB3863
                        - Arn
                    - /*
        Version: "2012-10-17"
      PolicyName: LambdaExecutionRoleDefaultPolicy6D69732F
      Roles:
        - Ref: LambdaExecutionRoleD5C26073
    Metadata:
      aws:cdk:path: mmmtesting/LambdaExecutionRole/DefaultPolicy/Resource
