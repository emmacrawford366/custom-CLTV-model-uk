  ACMNotebookLifecycleConfig:
    Type: AWS::SageMaker::NotebookInstanceLifecycleConfig
    Properties:
      NotebookInstanceLifecycleConfigName:
        Fn::Sub: ${AWS::StackName}-lifecycle-config
      OnCreate:
        - Content:
            Fn::Base64:
              Fn::Sub:
                - "#!/bin/bash

                  \        set -e


                  \        # Download and extract from pre-signed URL

                  \        cd /home/ec2-user/SageMaker


                  \        echo \"Creating env variables\"

                  \        echo \"Setting DYNAMODB_TABLE_CONFIGS to: ${DYNAMODB_TABLE_CONFIGS}\"

                  \        echo \"Setting DYNAMODB_TABLE_EXECUTIONS to: ${DYNAMODB_TABLE_EXECUTIONS}\"

                  \        echo \"Setting SECRETS_NAME to: ${SECRETS_NAME}\"

                  \        echo \"Setting STEP_FUNCTION_ARN to: ${STEP_FUNCTION_ARN}\"

                  \        echo \"Setting ECR_ACCESS_ROLE to: ${ECR_ACCESS_ROLE}\"

                  \        echo \"Setting CLOUDWATCH_ACCESS_ROLE to: ${CLOUDWATCH_ACCESS_ROLE}\"

                  \        echo \"Setting ECR_REPO_NAME to: ${ECR_REPO_NAME}\"

                  \       \ 

                  \        # Create environment file in user's home directory

                  \        echo \"export DYNAMODB_TABLE_CONFIGS=${DYNAMODB_TABLE_CONFIGS}\" >> /home/ec2-user/.bashrc

                  \        echo \"export DYNAMODB_TABLE_EXECUTIONS=${DYNAMODB_TABLE_EXECUTIONS}\" >> /home/ec2-user/.bashrc

                  \        echo \"export SECRETS_NAME=${SECRETS_NAME}\" >> /home/ec2-user/.bashrc

                  \        echo \"export STEP_FUNCTION_ARN=${STEP_FUNCTION_ARN}\" >> /home/ec2-user/.bashrc

                  \        echo \"export ECR_ACCESS_ROLE=${ECR_ACCESS_ROLE}\" >> /home/ec2-user/.bashrc  \ 

                  \        echo \"export CLOUDWATCH_ACCESS_ROLE=${CLOUDWATCH_ACCESS_ROLE}\" >> /home/ec2-user/.bashrc

                  \        echo \"export ECR_REPO_NAME=${ECR_REPO_NAME}\" >> /home/ec2-user/.bashrc   \ 


                  \        # Create Jupyter kernel environment file

                  \        mkdir -p /home/ec2-user/.jupyter

                  \        cat > /home/ec2-user/.jupyter/jupyter_notebook_config.py << EOF

                  # Set environment variables for Jupyter kernels

                  import os

                  os.environ['DYNAMODB_TABLE_CONFIGS'] = '${DYNAMODB_TABLE_CONFIGS}'

                  os.environ['DYNAMODB_TABLE_EXECUTIONS'] = '${DYNAMODB_TABLE_EXECUTIONS}'

                  os.environ['SECRETS_NAME'] = '${SECRETS_NAME}'

                  os.environ['STEP_FUNCTION_ARN'] = '${STEP_FUNCTION_ARN}'

                  os.environ['ECR_ACCESS_ROLE'] = '${ECR_ACCESS_ROLE}'

                  os.environ['CLOUDWATCH_ACCESS_ROLE'] = '${CLOUDWATCH_ACCESS_ROLE}'

                  os.environ['ECR_REPO_NAME'] = '${ECR_REPO_NAME}'


                  # Configure Jupyter to inherit environment variables

                  c = get_config()

                  c.KernelManager.env = {

                  \    'DYNAMODB_TABLE_CONFIGS': '${DYNAMODB_TABLE_CONFIGS}',

                  \    'DYNAMODB_TABLE_EXECUTIONS': '${DYNAMODB_TABLE_EXECUTIONS}',

                  \    'SECRETS_NAME': '${SECRETS_NAME}',

                  \    'STEP_FUNCTION_ARN': '${STEP_FUNCTION_ARN}',

                  \    'ECR_ACCESS_ROLE': '${ECR_ACCESS_ROLE}',

                  \    'CLOUDWATCH_ACCESS_ROLE': '${CLOUDWATCH_ACCESS_ROLE}',

                  \    'ECR_REPO_NAME': '${ECR_REPO_NAME}'

                  }

                  EOF


                  \        # Also create a profile.d style script for terminal sessions

                  \        mkdir -p /home/ec2-user/.config

                  \        cat > /home/ec2-user/.config/acm_env.sh << EOF

                  export DYNAMODB_TABLE_CONFIGS='${DYNAMODB_TABLE_CONFIGS}'

                  export DYNAMODB_TABLE_EXECUTIONS='${DYNAMODB_TABLE_EXECUTIONS}'

                  export SECRETS_NAME='${SECRETS_NAME}'

                  export STEP_FUNCTION_ARN='${STEP_FUNCTION_ARN}'

                  export ECR_ACCESS_ROLE='${ECR_ACCESS_ROLE}'

                  export CLOUDWATCH_ACCESS_ROLE='${CLOUDWATCH_ACCESS_ROLE}'

                  export ECR_REPO_NAME='${ECR_REPO_NAME}'

                  EOF


                  \        # Source the environment file in .bashrc

                  \        echo \"source /home/ec2-user/.config/acm_env.sh\" >> /home/ec2-user/.bashrc


                  \        #Restart required for jupyter to have access to env variables

                  \        sudo systemctl restart jupyter-server --no-block

                  \        echo \"Create Script complete - environment variables set in user space\"


                  \        "
                - DYNAMODB_TABLE_CONFIGS:
                    Ref: ACMAlgorithmConfigsTable54D3AB22
                  DYNAMODB_TABLE_EXECUTIONS:
                    Ref: PipelineExecutionsTable2DEF886F
                  SECRETS_NAME:
