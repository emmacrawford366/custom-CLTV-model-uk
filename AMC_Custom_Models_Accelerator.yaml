Parameters:
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing packaged Lambda artifacts
  LambdaCodeS3KeyPrefix:
    Type: String
    Default: lambda-artifacts
    Description: S3 key prefix for Lambda zip artifacts
  LambdaCodeVersion:
    Type: String
    Description: Artifact version (used as zip filename, e.g. 2026-11-02-1)

Resources:
  ACMDataBucket10FB3863:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-acm-artifacts-bucket-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: ACM-Custom-Models
        - Key: Component
          Value: ML-Pipeline
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      aws:cdk:path: mmmtesting/ACMDataBucket/Resource
  ACMECRRepository0DA7DBA7:
    Type: AWS::ECR::Repository
    Properties:
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Delete untagged images after 30 days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countNumber":30,"countUnit":"days"},"action":{"type":"expire"}}]}'
      RepositoryName:
        Fn::Sub: ${AWS::StackName}-acm-repo
      Tags:
        - Key: Application
          Value: ACM-Custom-Models
        - Key: Component
          Value: ML-Pipeline
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: mmmtesting/ACMECRRepository/Resource
  ACMAlgorithmConfigsTable54D3AB22:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: acm_algorithm_name
          AttributeType: S
        - AttributeName: instance_id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: acm_algorithm_name
          KeyType: HASH
        - AttributeName: instance_id
          KeyType: RANGE
      TableName:
        Fn::Sub: ${AWS::StackName}-ACM-Algorithm-Configs
      Tags:
        - Key: Application
          Value: ACM-Custom-Models
        - Key: Component
          Value: ML-Pipeline
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: mmmtesting/ACMAlgorithmConfigsTable/Resource
  PipelineExecutionsTable2DEF886F:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: acm_algorithm_name
          AttributeType: S
        - AttributeName: execution_timestamp
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: acm_algorithm_name
          KeyType: HASH
        - AttributeName: execution_timestamp
          KeyType: RANGE
      TableName:
        Fn::Sub: ${AWS::StackName}-PipeLine-Executions
      Tags:
        - Key: Application
          Value: ACM-Custom-Models
        - Key: Component
          Value: ML-Pipeline
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: mmmtesting/PipelineExecutionsTable/Resource
  AmazonAdsApiSecrets3DCB4A44:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Amazon Ads API Secrets for ACM
      Name:
        Fn::Sub: ${AWS::StackName}-Amazon-Ads-API-Secrets
      SecretString: '{"CLIENT_ID":"","CLIENT_SECRET":"","REFRESH_TOKEN":""}'
      Tags:
        - Key: Application
          Value: ACM-Custom-Models
        - Key: Component
          Value: ML-Pipeline
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: mmmtesting/AmazonAdsApiSecrets/Resource
  ACMCloudWatchAccessRole4111A26A:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: cleanrooms-ml.amazonaws.com
        Version: "2012-10-17"
      Description: Role for ACM CloudWatch access
      RoleName:
        Fn::Sub: ${AWS::StackName}-ACM-CloudWatchAccess
      Tags:
        - Key: Application
          Value: ACM-Custom-Models
        - Key: Component
          Value: ML-Pipeline
    Metadata:
      aws:cdk:path: mmmtesting/ACMCloudWatchAccessRole/Resource
  ACMCloudWatchAccessRoleDefaultPolicyF179A896:
